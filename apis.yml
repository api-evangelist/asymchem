name: Asymchem
description: 'Asymchem (Asymchem Laboratories (Tianjin) Co., Ltd.) is a global contract
  development and manufacturing organization (CDMO) with more than 25 years of experience
  delivering integrated, cGMP-compliant services across the pharmaceutical value chain.
  Its single-source model spans route scouting, process research and development,
  scale-up, and commercial manufacturing for small molecules, peptides, oligonucleotides,
  chemical macromolecules, biologics, and synthetic biology, and is known for green
  chemistry and continuous flow chemistry. Headquartered in Morrisville, North Carolina
  with major R&D and manufacturing operations in China, the U.S., and the U.K., Asymchem
  employs roughly 9,000 people and is publicly listed (002821.SZ / 6821.HK). Surfaced
  as a portfolio company of Hongshan and added to the API Evangelist network. Note:
  "API" in Asymchem''s context refers to Active Pharmaceutical Ingredient manufacturing,
  not a public web/developer API — the company publishes no developer API surface.'
